<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enterprise CRM Shell</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans antialiased h-screen flex flex-col">

  <!-- Top Navigation Header -->
  <header class="bg-slate-900 text-white shadow-md flex justify-between items-center px-6 py-3 shrink-0">
    <div class="flex items-center gap-3">
      <i class="fa-solid fa-layer-group text-xl text-blue-400"></i>
      <h1 class="font-bold text-lg tracking-wide">Enterprise CRM</h1>
    </div>
    
    <!-- Role-Based Top Level Modules Navigation -->
    <nav class="hidden md:flex items-center space-x-1 text-sm font-medium">
      <button onclick="switchLayout('pmLayout')" id="nav-pmLayout" class="nav-btn px-3 py-2 rounded-md transition hover:bg-slate-800">
        <i class="fa-solid fa-bullhorn mr-1"></i> Page Manager
      </button>
      <button onclick="switchLayout('opsLayout')" id="nav-opsLayout" class="nav-btn px-3 py-2 rounded-md transition hover:bg-slate-800">
        <i class="fa-solid fa-gears mr-1"></i> Operations
      </button>
      <button onclick="switchLayout('direkLayout')" id="nav-direkLayout" class="nav-btn px-3 py-2 rounded-md transition hover:bg-slate-800">
        <i class="fa-solid fa-chart-line mr-1"></i> Executive
      </button>
      <button onclick="switchLayout('hrLayout')" id="nav-hrLayout" class="nav-btn px-3 py-2 rounded-md transition hover:bg-slate-800">
        <i class="fa-solid fa-users mr-1"></i> HR
      </button>
      <button onclick="switchLayout('itLayout')" id="nav-itLayout" class="nav-btn px-3 py-2 rounded-md transition hover:bg-slate-800">
        <i class="fa-solid fa-code-branch mr-1"></i> IT Manager
      </button>
    </nav>

    <!-- User Profile & Logout -->
    <div class="flex items-center gap-4">
      <div class="text-right text-xs hidden sm:block">
        <div id="userDisplayName" class="font-semibold text-gray-200">User Account</div>
        <div id="userRoleBadge" class="text-blue-400 font-mono text-[10px] uppercase">Loading...</div>
      </div>
      <button onclick="logout()" class="text-gray-400 hover:text-red-400 text-sm transition" title="Logout">
        <i class="fa-solid fa-right-from-bracket text-lg"></i>
      </button>
    </div>
  </header>

  <!-- Dynamic Layout Injection Container -->
  <main id="mainContent" class="flex-1 overflow-hidden relative p-4">
    <div class="flex items-center justify-center h-full text-gray-400">
      <i class="fa-solid fa-spinner fa-spin text-3xl mr-3"></i> Loading Module...
    </div>
  </main>

  <script>
    let activeLayout = '';

    // Function para palitan ang module shell (hal. pmLayout, opsLayout)
    function switchLayout(layoutName) {
      if (activeLayout === layoutName) return;
      activeLayout = layoutName;

      // Update Active Navigation Button Styling
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('bg-blue-600', 'text-white');
        btn.classList.add('text-gray-300');
      });
      const activeBtn = document.getElementById('nav-' + layoutName);
      if (activeBtn) {
        activeBtn.classList.add('bg-blue-600', 'text-white');
        activeBtn.classList.remove('text-gray-300');
      }

      // Show Loading State
      document.getElementById('mainContent').innerHTML = `
        <div class="flex items-center justify-center h-full text-gray-400">
          <i class="fa-solid fa-spinner fa-spin text-3xl mr-3"></i> Loading ${layoutName}...
        </div>
      `;

      // Fetch Layout via Apps Script Server Call
      google.script.run
        .withSuccessHandler(html => {
          document.getElementById('mainContent').innerHTML = html;
        })
        .withFailureHandler(err => {
          document.getElementById('mainContent').innerHTML = `
            <div class="p-6 bg-red-50 text-red-700 rounded-lg border border-red-200 m-4">
              <h3 class="font-bold"><i class="fa-solid fa-triangle-exclamation mr-2"></i>Error Loading Module</h3>
              <p class="text-sm mt-1">${err.message}</p>
            </div>
          `;
        })
        .includeModule(layoutName);
    }

    // Default Initialization on Page Load
    window.addEventListener('DOMContentLoaded', () => {
      // Load Page Manager (pmLayout) as Default Initial View
      switchLayout('pmLayout');
    });

    function logout() {
      google.script.run.withSuccessHandler(url => {
        window.location.href = url;
      }).getScriptUrl();
    }
  </script>
</body>
</html>
