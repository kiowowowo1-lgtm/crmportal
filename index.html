<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autoshop Multi-Role CRM & Operations System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans antialiased">

  <!-- API ENDPOINT CONFIGURATION -->
  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyCHSpEc6KeZfCfD0YAuLsyMkLsa-LI5SGbINSTTgZAx_QyyzO9IBwjFa6J_evGHho/exec";
    let currentUser = null;
  </script>

  <!-- NAVIGATION BAR -->
  <nav id="navbar" class="bg-slate-900 text-white shadow-md hidden">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <span class="text-xl font-bold text-red-500">AUTOSHOP</span>
        <span class="text-xs bg-slate-800 text-slate-300 px-2 py-1 rounded border border-slate-700" id="userRoleBadge">ROLE</span>
      </div>
      <div class="flex items-center space-x-4 text-sm">
        <span id="userInfo" class="font-medium"></span>
        <button onclick="logout()" class="bg-red-600 hover:bg-red-700 px-3 py-1.5 rounded transition text-xs font-semibold">Logout</button>
      </div>
    </div>
  </nav>

  <div class="max-w-7xl mx-auto p-4">

    <!-- 1. LOGIN / USER REGISTRATION PANEL -->
    <div id="authSection" class="max-w-md mx-auto my-12 bg-white rounded-xl shadow-lg p-6 border border-gray-200">
      <div class="text-center mb-6">
        <h2 class="text-2xl font-bold text-gray-900">Autoshop Portal</h2>
        <p class="text-sm text-gray-500">Login or create account for testing</p>
      </div>

      <!-- Login Form -->
      <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Username</label>
          <input type="text" id="loginUsername" required class="w-full border rounded px-3 py-2 text-sm focus:ring-2 focus:ring-red-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Password</label>
          <input type="password" id="loginPassword" required class="w-full border rounded px-3 py-2 text-sm focus:ring-2 focus:ring-red-500 outline-none">
        </div>
        <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-2 rounded transition text-sm">Sign In</button>
      </form>

      <hr class="my-6 border-gray-200">

      <!-- Registration Form (For Instant Testing) -->
      <div class="bg-gray-50 p-4 rounded-lg border border-gray-200">
        <h3 class="text-sm font-bold text-gray-700 mb-3">➕ Add User for Testing</h3>
        <form id="registerForm" onsubmit="handleRegisterUser(event)" class="space-y-3">
          <div>
            <input type="text" id="regFullName" placeholder="Full Name" required class="w-full border text-xs rounded px-2.5 py-1.5">
          </div>
          <div class="grid grid-cols-2 gap-2">
            <input type="text" id="regUsername" placeholder="Username" required class="border text-xs rounded px-2.5 py-1.5">
            <input type="password" id="regPassword" placeholder="Password" required class="border text-xs rounded px-2.5 py-1.5">
          </div>
          <div class="grid grid-cols-2 gap-2">
            <select id="regRole" required class="border text-xs rounded px-2 py-1.5">
              <option value="IT">IT Admin</option>
              <option value="PM">Page Manager (PM)</option>
              <option value="SA">Service Advisor (SA)</option>
              <option value="BM">Branch Manager (BM)</option>
            </select>
            <select id="regBranch" required class="border text-xs rounded px-2 py-1.5">
              <option value="Mandaluyong">Mandaluyong</option>
              <option value="Mastermind">Mastermind HQ</option>
            </select>
          </div>
          <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold py-1.5 rounded transition">Create User Account</button>
        </form>
      </div>
    </div>

    <!-- 2. MAIN DASHBOARD CONTENT (HIDDEN BY DEFAULT) -->
    <div id="dashboardSection" class="hidden space-y-6">

      <!-- ACTION BUTTONS BAR -->
      <div class="flex justify-between items-center bg-white p-4 rounded-lg shadow-sm border border-gray-200">
        <h1 class="text-lg font-bold text-gray-800">Operational Workspace</h1>
        <div class="flex space-x-2">
          <button onclick="openNewLeadModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded text-xs font-semibold flex items-center space-x-1">
            <span>+ New Lead (PM)</span>
          </button>
          <button onclick="openAddProductModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded text-xs font-semibold flex items-center space-x-1">
            <span>+ Add Product (SA/BM)</span>
          </button>
        </div>
      </div>

      <!-- LEADS & APPOINTMENTS TABLE -->
      <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
        <div class="px-4 py-3 bg-gray-50 border-b flex justify-between items-center">
          <h2 class="text-sm font-bold text-gray-700 uppercase tracking-wider">Active Leads & Appointments</h2>
          <button onclick="loadLeads()" class="text-xs text-blue-600 hover:underline">🔄 Refresh Data</button>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs text-gray-600">
            <thead class="bg-gray-100 text-gray-700 font-bold uppercase">
              <tr>
                <th class="p-3">ID</th>
                <th class="p-3">Client Name</th>
                <th class="p-3">Contact</th>
                <th class="p-3">Car / Plate</th>
                <th class="p-3">Service</th>
                <th class="p-3">Branch</th>
                <th class="p-3">Appt Date</th>
                <th class="p-3">Status</th>
                <th class="p-3">Last Edited By</th>
              </tr>
            </thead>
            <tbody id="leadsTableBody" class="divide-y divide-gray-200">
              <tr>
                <td colspan="9" class="p-4 text-center text-gray-400">Loading records...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>

  </div>

  <!-- MODAL: CREATE NEW LEAD -->
  <div id="newLeadModal" class="fixed inset-0 bg-black/50 hidden flex justify-center items-center p-4 z-50">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-md p-6 space-y-4">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-bold text-gray-800">Add New Lead Record</h3>
        <button onclick="closeModal('newLeadModal')" class="text-gray-400 hover:text-gray-600 font-bold text-lg">&times;</button>
      </div>
      <form id="createLeadForm" onsubmit="handleCreateLead(event)" class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Client Name</label>
          <input type="text" id="leadClientName" required class="w-full border rounded px-2.5 py-1.5 text-xs">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Contact No.</label>
            <input type="text" id="leadContact" placeholder="0917XXXXXXX" required class="w-full border rounded px-2.5 py-1.5 text-xs">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Car / Plate</label>
            <input type="text" id="leadCar" placeholder="Vios - ABC 1234" required class="w-full border rounded px-2.5 py-1.5 text-xs">
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Requested Service</label>
          <select id="leadService" class="w-full border rounded px-2 py-1.5 text-xs">
            <option value="Change Oil (Fully Synthetic)">Change Oil (Fully Synthetic)</option>
            <option value="PMS Check up">PMS Check up</option>
            <option value="Aircon Check up">Aircon Check up</option>
            <option value="Computer Scan Diagnosis">Computer Scan Diagnosis</option>
          </select>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Branch</label>
            <select id="leadBranch" class="w-full border rounded px-2 py-1.5 text-xs">
              <option value="Mandaluyong">Mandaluyong</option>
              <option value="Mastermind">Mastermind HQ</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Appt Date</label>
            <input type="date" id="leadApptDate" required class="w-full border rounded px-2 py-1.5 text-xs">
          </div>
        </div>
        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 rounded text-xs transition">Save Lead Record</button>
      </form>
    </div>
  </div>

  <!-- SCRIPT CONTROLLER -->
  <script>
    // Handle User Login
    async function handleLogin(e) {
      e.preventDefault();
      const payload = {
        action: "login",
        username: document.getElementById("loginUsername").value.trim(),
        password: document.getElementById("loginPassword").value.trim()
      };

      Swal.fire({ title: 'Authenticating...', didOpen: () => Swal.showLoading() });

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });
        const result = await response.json();

        if (result.status === "success") {
          currentUser = result.user;
          Swal.fire({ icon: 'success', title: 'Welcome!', text: `Logged in as ${currentUser.full_name}`, timer: 1500, showConfirmButton: false });
          setupDashboard();
        } else {
          Swal.fire({ icon: 'error', title: 'Login Failed', text: result.message });
        }
      } catch (err) {
        Swal.fire({ icon: 'error', title: 'Connection Error', text: err.toString() });
      }
    }

    // Register User (For Testing)
    async function handleRegisterUser(e) {
      e.preventDefault();
      const payload = {
        action: "addUser",
        full_name: document.getElementById("regFullName").value,
        username: document.getElementById("regUsername").value,
        password: document.getElementById("regPassword").value,
        role: document.getElementById("regRole").value,
        branch_assigned: document.getElementById("regBranch").value,
        position_title: "Tester Account",
        created_by: "SYSTEM"
      };

      Swal.fire({ title: 'Creating user...', didOpen: () => Swal.showLoading() });

      try {
        const response = await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
        const result = await response.json();

        if (result.status === "success") {
          Swal.fire({ icon: 'success', title: 'User Created!', text: 'You can now sign in with this account.' });
          document.getElementById("registerForm").reset();
        } else {
          Swal.fire({ icon: 'error', title: 'Error', text: result.message });
        }
      } catch (err) {
        Swal.fire({ icon: 'error', title: 'Connection Error', text: err.toString() });
      }
    }

    // Setup UI Dashboard
    function setupDashboard() {
      document.getElementById("authSection").classList.add("hidden");
      document.getElementById("navbar").classList.remove("hidden");
      document.getElementById("dashboardSection").classList.remove("hidden");

      document.getElementById("userInfo").innerText = `${currentUser.full_name} (${currentUser.branch})`;
      document.getElementById("userRoleBadge").innerText = currentUser.role;

      loadLeads();
    }

    // Load Leads from Database
    async function loadLeads() {
      const tbody = document.getElementById("leadsTableBody");
      tbody.innerHTML = `<tr><td colspan="9" class="p-4 text-center text-gray-400">Fetching records...</td></tr>`;

      try {
        const response = await fetch(`${API_URL}?action=getLeads`);
        const result = await response.json();

        if (result.status === "success" && result.data.length > 0) {
          tbody.innerHTML = result.data.map(lead => `
            <tr class="hover:bg-gray-50 border-b">
              <td class="p-3 font-mono text-gray-500">${lead.lead_id}</td>
              <td class="p-3 font-bold text-gray-800">${lead.client_name}</td>
              <td class="p-3">${lead.contact_number}</td>
              <td class="p-3">${lead.car_plate_model}</td>
              <td class="p-3">${lead.requested_service}</td>
              <td class="p-3"><span class="bg-gray-200 px-2 py-0.5 rounded text-[10px] font-semibold">${lead.branch}</span></td>
              <td class="p-3">${lead.appointment_date ? new Date(lead.appointment_date).toLocaleDateString() : 'N/A'}</td>
              <td class="p-3">
                <select onchange="inlineUpdateStatus('${lead.lead_id}', this.value)" class="border text-xs rounded px-1.5 py-0.5 bg-white font-semibold">
                  <option value="Interested" ${lead.status === 'Interested' ? 'selected' : ''}>Interested</option>
                  <option value="Booked" ${lead.status === 'Booked' ? 'selected' : ''}>Booked</option>
                  <option value="Showed Up" ${lead.status === 'Showed Up' ? 'selected' : ''}>Showed Up</option>
                  <option value="Cancelled" ${lead.status === 'Cancelled' ? 'selected' : ''}>Cancelled</option>
                </select>
              </td>
              <td class="p-3 text-gray-400 text-[11px]">${lead.last_edited_by || 'N/A'}</td>
            </tr>
          `).join('');
        } else {
          tbody.innerHTML = `<tr><td colspan="9" class="p-4 text-center text-gray-400">No leads recorded yet. Click '+ New Lead' to add one.</td></tr>`;
        }
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="9" class="p-4 text-center text-red-500">Failed to load data.</td></tr>`;
      }
    }

    // Inline Status Update
    async function inlineUpdateStatus(leadId, newStatus) {
      const payload = {
        action: "updateLeadStatus",
        lead_id: leadId,
        status: newStatus,
        updated_by: currentUser.username
      };

      try {
        const response = await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
        const result = await response.json();
        if (result.status === "success") {
          const Toast = Swal.mixin({ toast: true, position: 'top-end', showConfirmButton: false, timer: 2000 });
          Toast.fire({ icon: 'success', title: `Status updated to ${newStatus}` });
        }
      } catch (err) {
        Swal.fire({ icon: 'error', title: 'Update failed', text: err.toString() });
      }
    }

    // Handle Create New Lead
    async function handleCreateLead(e) {
      e.preventDefault();
      const payload = {
        action: "createLead",
        client_name: document.getElementById("leadClientName").value,
        contact_number: document.getElementById("leadContact").value,
        car_plate_model: document.getElementById("leadCar").value,
        requested_service: document.getElementById("leadService").value,
        branch: document.getElementById("leadBranch").value,
        appointment_date: document.getElementById("leadApptDate").value,
        booked_by: currentUser.username,
        page_manager: currentUser.username
      };

      Swal.fire({ title: 'Saving lead...', didOpen: () => Swal.showLoading() });

      try {
        const response = await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
        const result = await response.json();

        if (result.status === "success") {
          Swal.fire({ icon: 'success', title: 'Lead Saved!', timer: 1500, showConfirmButton: false });
          closeModal('newLeadModal');
          document.getElementById("createLeadForm").reset();
          loadLeads();
        }
      } catch (err) {
        Swal.fire({ icon: 'error', title: 'Error', text: err.toString() });
      }
    }

    // Modal Handlers
    function openNewLeadModal() { document.getElementById("newLeadModal").classList.remove("hidden"); }
    function closeModal(modalId) { document.getElementById(modalId).classList.add("hidden"); }
    function logout() { location.reload(); }
  </script>
</body>
</html>
