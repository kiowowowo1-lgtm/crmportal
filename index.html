<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM Enterprise System - Authentication</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* Custom loader animation */
    .spinner {
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      border-top-color: #3b82f6;
      width: 20px;
      height: 20px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center font-sans antialiased selection:bg-blue-500 selection:text-white">

  <!-- ========================================== -->
  <!-- 1. LOGIN CONTAINER (Default Visible View)  -->
  <!-- ========================================== -->
  <div id="loginCard" class="w-full max-w-md p-6 sm:p-8 bg-slate-900 rounded-2xl shadow-2xl border border-slate-800 transition-all duration-300">
    
    <!-- Header Logo & Title -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 bg-blue-600/10 border border-blue-500/20 rounded-2xl mb-3 text-blue-500 text-2xl">
        <i class="fa-solid fa-car-tunnel"></i>
      </div>
      <h1 class="text-2xl font-black tracking-wider text-white">CRM ENTERPRISE</h1>
      <p class="text-xs text-slate-400 mt-1 uppercase tracking-widest font-semibold">Authorized Personnel Access</p>
    </div>

    <!-- Login Form -->
    <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-5" autocomplete="off">
      
      <!-- Username Input -->
      <div>
        <label for="username" class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1.5">
          Username
        </label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500 text-sm">
            <i class="fa-solid fa-user"></i>
          </span>
          <input 
            type="text" 
            id="username" 
            required 
            placeholder="e.g. pm_lloyd"
            class="w-full bg-slate-950 border border-slate-800 rounded-xl py-3 pl-10 pr-4 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors"
          >
        </div>
      </div>

      <!-- Password Input -->
      <div>
        <label for="password" class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1.5">
          Password
        </label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-500 text-sm">
            <i class="fa-solid fa-lock"></i>
          </span>
          <input 
            type="password" 
            id="password" 
            required 
            placeholder="••••••••"
            class="w-full bg-slate-950 border border-slate-800 rounded-xl py-3 pl-10 pr-10 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors"
          >
          <button 
            type="button" 
            onclick="togglePasswordVisibility()" 
            class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-slate-500 hover:text-slate-300 text-sm focus:outline-none"
          >
            <i id="togglePasswordIcon" class="fa-solid fa-eye"></i>
          </button>
        </div>
      </div>

      <!-- Inline Error Banner -->
      <div id="errorMessage" class="hidden flex items-start gap-2.5 p-3.5 rounded-xl bg-red-950/50 border border-red-800/50 text-red-400 text-xs font-medium">
        <i class="fa-solid fa-circle-exclamation text-sm mt-0.5 shrink-0"></i>
        <span id="errorText">Invalid credentials. Please try again.</span>
      </div>

      <!-- Submit Button -->
      <button 
        type="submit" 
        id="loginBtn" 
        class="w-full bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-blue-600/20 transition-all duration-200 flex items-center justify-center space-x-2 text-sm disabled:opacity-50 disabled:cursor-not-allowed"
      >
        <span id="btnText">Sign In</span>
        <div id="btnSpinner" class="spinner hidden"></div>
      </button>

    </form>

    <!-- Footer Security Note -->
    <div class="mt-8 pt-6 border-t border-slate-800/80 text-center">
      <p class="text-[11px] text-slate-500 flex items-center justify-center gap-1.5">
        <i class="fa-solid fa-shield-halved text-slate-600"></i>
        Protected by Role-Based Access Control (RBAC)
      </p>
    </div>

  </div>

  <!-- ========================================== -->
  <!-- 2. APPLICATION SHELL CONTAINER            -->
  <!-- ========================================== -->
  <div id="appShellContainer" class="hidden w-full min-h-screen">
    <?!= includeModule('dashboard'); ?>
  </div>

  <!-- ========================================== -->
  <!-- 3. CLIENT-SIDE SCRIPT LOGIC               -->
  <!-- ========================================== -->
  <script>
    /**
     * Toggles Password Visibility
     */
    function togglePasswordVisibility() {
      const pwdInput = document.getElementById('password');
      const icon = document.getElementById('togglePasswordIcon');
      
      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        pwdInput.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    }

    /**
     * Handles Form Submission & Authentication Request
     */
    function handleLogin(e) {
      e.preventDefault();
      
      const usernameInput = document.getElementById('username').value.trim();
      const passwordInput = document.getElementById('password').value;
      const loginBtn = document.getElementById('loginBtn');
      const btnText = document.getElementById('btnText');
      const btnSpinner = document.getElementById('btnSpinner');
      const errorBox = document.getElementById('errorMessage');

      if (!usernameInput || !passwordInput) {
        displayError('Please fill in both username and password.');
        return;
      }

      // UI Loading State
      loginBtn.disabled = true;
      btnText.innerText = 'Authenticating...';
      btnSpinner.classList.remove('hidden');
      errorBox.classList.add('hidden');

      // Server-side Call to authService.gs
      google.script.run
        .withSuccessHandler(onLoginSuccess)
        .withFailureHandler(onLoginFailure)
        .authenticateUser(usernameInput, passwordInput);
    }

    /**
     * Handles Successful Authentication Response
     */
    function onLoginSuccess(response) {
      const loginBtn = document.getElementById('loginBtn');
      const btnText = document.getElementById('btnText');
      const btnSpinner = document.getElementById('btnSpinner');

      if (response && response.success) {
        // Save current user session globally in DOM window
        window.currentUser = response.user;

        // Transition from Login UI to Application Shell
        document.getElementById('loginCard').classList.add('hidden');
        document.getElementById('appShellContainer').classList.remove('hidden');

        // Initialize Main Shell Container (defined inside dashboard.html)
        if (typeof initDashboardShell === 'function') {
          initDashboardShell(response.user);
        } else {
          console.error('initDashboardShell() function not found in dashboard.html');
        }
      } else {
        // Reset UI & Show Error
        btnSpinner.classList.add('hidden');
        btnText.innerText = 'Sign In';
        loginBtn.disabled = false;
        displayError(response ? response.message : 'Invalid credentials. Access denied.');
      }
    }

    /**
     * Handles GAS Server Errors
     */
    function onLoginFailure(error) {
      const loginBtn = document.getElementById('loginBtn');
      const btnText = document.getElementById('btnText');
      const btnSpinner = document.getElementById('btnSpinner');

      btnSpinner.classList.add('hidden');
      btnText.innerText = 'Sign In';
      loginBtn.disabled = false;

      displayError('System Error: ' + (error.message || 'Unable to connect to server.'));
    }

    /**
     * Helper to render error message
     */
    function displayError(msg) {
      const errorBox = document.getElementById('errorMessage');
      const errorText = document.getElementById('errorText');
      errorText.innerText = msg;
      errorBox.classList.remove('hidden');
    }
  </script>
</body>
</html>
