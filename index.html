<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM Enterprise Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      background: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
    }
    .card-login {
      background: #ffffff;
      border-radius: 12px;
      padding: 2.5rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>

  <div class="card-login">
    <div class="text-center mb-4">
      <div class="bg-primary text-white rounded-3 d-inline-flex align-items-center justify-content-center mb-2" style="width: 50px; height: 50px;">
        <i class="fa-solid fa-briefcase fs-4"></i>
      </div>
      <h4 class="fw-bold m-0">CRM Enterprise</h4>
      <small class="text-muted">Mag-login para magpatuloy</small>
    </div>

    <div id="alertMsg" class="alert alert-danger py-2 small d-none" role="alert"></div>

    <form id="loginForm" onsubmit="submitLogin(event)">
      <div class="mb-3">
        <label class="form-label small fw-bold text-secondary">USERNAME</label>
        <input type="text" id="username" class="form-control" placeholder="Ipasok ang username" required>
      </div>

      <div class="mb-4">
        <label class="form-label small fw-bold text-secondary">PASSWORD</label>
        <input type="password" id="password" class="form-control" placeholder="Ipasok ang password" required>
      </div>

      <button type="submit" id="btnSubmit" class="btn btn-primary w-100 py-2 fw-bold">
        <span id="btnText">Sign In</span>
        <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
      </button>
    </form>
  </div>

  <script>
    // Redirect agad kung may active session na
    window.addEventListener('DOMContentLoaded', () => {
      if (sessionStorage.getItem('crm_user')) {
        goToDashboard();
      }
    });

    function submitLogin(e) {
      e.preventDefault();
      
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value.trim();
      const alertMsg = document.getElementById('alertMsg');

      alertMsg.classList.add('d-none');
      toggleLoading(true);

      // Tawagin ang authService.gs
      google.script.run
        .withSuccessHandler(res => {
          toggleLoading(false);
          if (res && res.status === 'success') {
            sessionStorage.setItem('crm_user', JSON.stringify(res.user));
            goToDashboard();
          } else {
            alertMsg.textContent = res.message || 'Maling username o password.';
            alertMsg.classList.remove('d-none');
          }
        })
        .withFailureHandler(err => {
          toggleLoading(false);
          alertMsg.textContent = 'Server Error: ' + err.message;
          alertMsg.classList.remove('d-none');
        })
        .loginUser({ username: user, password: pass });
    }

    function toggleLoading(isLoading) {
      const btn = document.getElementById('btnSubmit');
      const text = document.getElementById('btnText');
      const spinner = document.getElementById('btnSpinner');

      btn.disabled = isLoading;
      if (isLoading) {
        text.textContent = 'Verifying...';
        spinner.classList.remove('d-none');
      } else {
        text.textContent = 'Sign In';
        spinner.classList.add('d-none');
      }
    }

    function goToDashboard() {
      google.script.run
        .withSuccessHandler(url => {
          window.location.href = url + '?page=dashboard';
        })
        .getScriptUrl();
    }
  </script>
</body>
</html>
