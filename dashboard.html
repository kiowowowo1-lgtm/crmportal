<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM Enterprise - Dashboard</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

  <style>
    :root {
      --sidebar-width: 250px;
      --topbar-height: 60px;
    }
    body {
      background-color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
    }
    
    /* Top Navigation Bar */
    .top-navbar {
      height: var(--topbar-height);
      background-color: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1030;
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Sidebar Navigation */
    .sidebar {
      width: var(--sidebar-width);
      position: fixed;
      top: var(--topbar-height);
      bottom: 0;
      left: 0;
      background-color: #0f172a;
      padding-top: 1rem;
      z-index: 1020;
      transition: all 0.3s ease;
    }
    .sidebar .nav-link {
      color: #94a3b8;
      padding: 0.75rem 1.25rem;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      transition: all 0.2s ease;
    }
    .sidebar .nav-link:hover, .sidebar .nav-link.active {
      color: #ffffff;
      background-color: #1e293b;
      border-left: 4px solid #2563eb;
    }

    /* Main Content Area */
    .main-content {
      margin-top: var(--topbar-height);
      margin-left: var(--sidebar-width);
      padding: 2rem;
      min-height: calc(100vh - var(--topbar-height));
    }

    /* Loader Overlay */
    .module-loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 300px;
    }
  </style>
</head>
<body>

  <!-- 1. Top Navigation Bar -->
  <header class="top-navbar">
    <div class="d-flex align-items-center gap-2">
      <div class="bg-primary text-white rounded p-1 d-flex align-items-center justify-content-center" style="width:32px; height:32px;">
        <i class="fa-solid fa-briefcase"></i>
      </div>
      <span class="fw-bold text-dark fs-5">CRM Enterprise</span>
    </div>

    <!-- User Profile Dropdown -->
    <div class="dropdown">
      <button class="btn btn-light border-0 dropdown-toggle d-flex align-items-center gap-2" type="button" data-bs-toggle="dropdown">
        <i class="fa-solid fa-circle-user fs-5 text-secondary"></i>
        <span id="navUsername" class="fw-semibold text-dark">User</span>
      </button>
      <ul class="dropdown-menu dropdown-menu-end shadow-sm">
        <li><a class="dropdown-menu-item dropdown-item text-danger" href="#" onclick="logoutUser()"><i class="fa-solid fa-right-from-bracket me-2"></i>Sign Out</a></li>
      </ul>
    </div>
  </header>

  <!-- 2. Sidebar Navigation -->
  <nav class="sidebar">
    <div class="nav flex-column">
      <a class="nav-link active" href="#" onclick="loadModule('overview', this)">
        <i class="fa-solid fa-chart-pie"></i>
        <span>Overview</span>
      </a>
      <a class="nav-link" href="#" onclick="loadModule('crm', this)">
        <i class="fa-solid fa-users"></i>
        <span>CRM Management</span>
      </a>
      <a class="nav-link" href="#" onclick="loadModule('ops', this)">
        <i class="fa-solid fa-list-check"></i>
        <span>Operations</span>
      </a>
      <a class="nav-link" href="#" onclick="loadModule('admin', this)">
        <i class="fa-solid fa-user-shield"></i>
        <span>Admin Controls</span>
      </a>
    </div>
  </nav>

  <!-- 3. Dynamic Main Content Area -->
  <main class="main-content" id="moduleContainer">
    <!-- Dynamic Module Content Will Render Here -->
  </main>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    let currentUser = null;

    // --- SESSION GUARD & INITIALIZATION ---
    window.addEventListener('DOMContentLoaded', () => {
      const storedUser = sessionStorage.getItem('crm_user');
      
      if (!storedUser) {
        // Redirection kapag walang valid session
        redirectToLogin();
        return;
      }

      currentUser = JSON.parse(storedUser);
      document.getElementById('navUsername').textContent = currentUser.username || currentUser.name || 'User';

      // Load default module (Overview)
      loadModule('overview');
    });

    // --- DYNAMIC MODULE LOADER ---
    function loadModule(moduleName, navElement = null) {
      // Update Active Navigation Styling
      if (navElement) {
        document.querySelectorAll('.sidebar .nav-link').forEach(link => link.classList.remove('active'));
        navElement.classList.add('active');
      }

      const container = document.getElementById('moduleContainer');
      
      // Render Loader UI habang nag-aantay ng response
      container.innerHTML = `
        <div class="module-loader">
          <div class="spinner-border text-primary" role="status"></div>
          <p class="text-muted mt-2 small">Loading module...</p>
        </div>
      `;

      // Tawagin ang backend main.gs para kunin ang module HTML component
      google.script.run
        .withSuccessHandler(htmlContent => {
          container.innerHTML = htmlContent;
        })
        .withFailureHandler(err => {
          container.innerHTML = `
            <div class="alert alert-danger" role="alert">
              <h5 class="alert-heading"><i class="fa-solid fa-triangle-exclamation me-2"></i>Error Loading Module</h5>
              <p class="mb-0">${err.message || 'Failed to fetch module contents.'}</p>
            </div>
          `;
        })
        .includeModule(moduleName);
    }

    // --- LOGOUT & REDIRECT ---
    function logoutUser() {
      sessionStorage.removeItem('crm_user');
      redirectToLogin();
    }

    function redirectToLogin() {
      google.script.run
        .withSuccessHandler(url => {
          window.location.href = url;
        })
        .getScriptUrl();
    }
  </script>
</body>
</html>
