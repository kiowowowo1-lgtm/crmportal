<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enterprise CRM - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 h-screen flex items-center justify-center px-4">

  <div class="max-w-md w-full bg-white rounded-xl shadow-2xl overflow-hidden p-8">
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-100 text-blue-600 rounded-full mb-3">
        <i class="fa-solid fa-shield-halved text-2xl"></i>
      </div>
      <h2 class="text-2xl font-bold text-gray-800">CRM Enterprise Portal</h2>
      <p class="text-xs text-gray-500 mt-1">Mag-login gamit ang iyong System Credentials</p>
    </div>

    <!-- Alert Message Container -->
    <div id="alertBox" class="hidden mb-4 p-3 rounded text-xs font-medium"></div>

    <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Username / Email</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
            <i class="fa-solid fa-user"></i>
          </span>
          <input type="text" id="username" required placeholder="user@company.com" 
            class="w-full pl-10 pr-4 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Password</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
            <i class="fa-solid fa-lock"></i>
          </span>
          <input type="password" id="password" required placeholder="••••••••" 
            class="w-full pl-10 pr-4 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>
      </div>

      <button type="submit" id="submitBtn" 
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg text-sm transition flex justify-center items-center gap-2">
        <span>Sign In</span>
        <i class="fa-solid fa-arrow-right text-xs"></i>
      </button>
    </form>
  </div>

  <script>
    function handleLogin(e) {
      e.preventDefault();
      const user = document.getElementById('username').value;
      const pass = document.getElementById('password').value;
      const alertBox = document.getElementById('alertBox');
      const submitBtn = document.getElementById('submitBtn');

      alertBox.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Authenticating...`;

      // Tawagin ang backend authService.gs (o main routing)
      google.script.run
        .withSuccessHandler(res => {
          if (res && res.success) {
            alertBox.className = "mb-4 p-3 rounded text-xs font-medium bg-green-100 text-green-700 border border-green-200 block";
            alertBox.innerText = "Success! Redirecting to Dashboard...";
            
            // Redirect papunta sa Dashboard gamit ang Routing Parameter
            google.script.run.withSuccessHandler(baseUrl => {
              window.location.href = baseUrl + "?page=dashboard";
            }).getScriptUrl();
          } else {
            submitBtn.disabled = false;
            submitBtn.innerHTML = `<span>Sign In</span><i class="fa-solid fa-arrow-right text-xs"></i>`;
            alertBox.className = "mb-4 p-3 rounded text-xs font-medium bg-red-100 text-red-700 border border-red-200 block";
            alertBox.innerText = res.message || "Invalid Username or Password.";
          }
        })
        .withFailureHandler(err => {
          submitBtn.disabled = false;
          submitBtn.innerHTML = `<span>Sign In</span><i class="fa-solid fa-arrow-right text-xs"></i>`;
          alertBox.className = "mb-4 p-3 rounded text-xs font-medium bg-red-100 text-red-700 border border-red-200 block";
          alertBox.innerText = "Server error: " + err.message;
        })
        .checkCredentials(user, pass); // Backend authentication function
    }
  </script>
</body>
</html>
